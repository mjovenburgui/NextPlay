{# Avatar de un perfil: la foto que haya elegido (subida, Steam, PlayStation o Xbox) o su inicial, con la forma que eligió. size: "sm", "md", "" o "lg". #}
<span class="avatar{% if size %} avatar-{{ size }}{% endif %} avatar-shape-{{ profile.avatar_shape }}" aria-hidden="true">
  {% if profile.avatar_url %}<img src="{{ profile.avatar_url }}" alt="" loading="lazy">{% else %}{{ profile.name|slice:":1"|upper }}{% endif %}
</span>
