{# Las casillas de «¿Dónde juegas?» (PLAY_PLATFORMS, en play_platform_choices), con marcadas las de where. Van en el #}
{# formulario de Vincular cuentas (_where_form.html) y en el primer paso de Configurar NextPlay. #}
<fieldset class="where-tiles">
  <legend class="visually-hidden">¿Dónde juegas?</legend>
  {% for key, name, sub in play_platform_choices %}
    <label class="where-tile where-{{ key }}">
      <input type="checkbox" name="donde" value="{{ key }}"{% if key in where %} checked{% endif %}>
      <span class="where-tile-logo" aria-hidden="true">{% if key == "steam" %}{% include "games/shop_icons/steam.svg" %}{% elif key == "pc" %}{% include "_icon.html" with name="monitor" %}{% elif key == "playstation" %}{% include "games/shop_icons/playstation.svg" %}{% elif key == "xbox" %}{% include "games/shop_icons/xbox.svg" %}{% else %}{% include "games/shop_icons/nintendo.svg" %}{% endif %}</span>
      <strong>{{ name }}</strong>
      <span class="where-tile-sub">{{ sub }}</span>
    </label>
  {% endfor %}
</fieldset>
