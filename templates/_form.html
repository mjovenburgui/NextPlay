{% csrf_token %}
{{ form.non_field_errors }}
{% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}">
    {% if field.widget_type == "checkbox" %}
      <label class="check">{{ field }} {{ field.label }}</label>
    {% else %}
      {{ field.label_tag }}
      {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
