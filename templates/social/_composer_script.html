{# Lo que hace la caja de publicar con las imágenes elegidas (social/_composer.html y social/thread_form.html): las enseña con su casilla «Spoiler» y reduce las muy grandes antes de subirlas. Busca el formulario con data-composer. #}
<script>
  // Caja de publicar (y la de abrir un hilo, que lleva la misma parte de las imágenes): enseña las imágenes elegidas (como mucho data-max, que se pueden elegir en varias veces y quitar),
  // cada una con su casilla «Spoiler», y reduce las que no caben o pesan demasiado antes de subirlas, como hace el editor
  // de reseñas.
  // Pantallas: Inicio (caja para publicar), Publicar, Nuevo hilo o pregunta.
  (function () {
    var form = document.querySelector("[data-composer]");
    var input = form.querySelector("[data-images]");
    var previews = form.querySelector("[data-previews]");
    var note = form.querySelector("[data-images-note]");
    var max = Number(form.dataset.max);
    var chosen = [];  // {file, spoiler}: las que se subirán, en orden
    var urls = [];

    // Devuelve (en una promesa) el archivo que se subirá: el mismo o, si es más grande de lo que se guarda o pesa
    // demasiado, una copia reducida en WebP (en PNG si el navegador no sabe hacer WebP).
    function shrink(file) {
      return new Promise(function (resolve) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var ratio = Math.min(1, form.dataset.maxWidth / img.naturalWidth, form.dataset.maxHeight / img.naturalHeight);
          if (ratio === 1 && file.size <= form.dataset.maxMb * 1048576) return resolve(file);
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.naturalWidth * ratio);
          canvas.height = Math.round(img.naturalHeight * ratio);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function (blob) {
            if (!blob) return resolve(file);
            var name = file.name.replace(/\.\w+$/, "") + (blob.type === "image/webp" ? ".webp" : ".png");
            resolve(new File([blob], name, { type: blob.type }));
          }, "image/webp", 0.9);
        };
        // Si el navegador no sabe leerla, que la compruebe el servidor y explique qué le pasa.
        img.onerror = function () {
          URL.revokeObjectURL(url);
          resolve(file);
        };
        img.src = url;
      });
    }

    // Pone en el selector los archivos elegidos (el servidor recibe esos) y pinta sus miniaturas, cada una con su casilla
    // «Spoiler» (con el número de su sitio, que es el que mira el servidor) y un botón para quitarla.
    function sync() {
      var transfer = new DataTransfer();
      chosen.forEach(function (item) { transfer.items.add(item.file); });
      input.files = transfer.files;
      urls.forEach(function (url) { URL.revokeObjectURL(url); });
      urls = [];
      previews.replaceChildren();
      previews.hidden = !chosen.length;
      chosen.forEach(function (item, i) {
        var slot = document.createElement("li");
        var img = document.createElement("img");
        img.alt = item.file.name;
        img.src = URL.createObjectURL(item.file);
        urls.push(img.src);
        var spoiler = document.createElement("label");
        spoiler.className = "composer-spoiler";
        spoiler.title = "Se verá borrosa hasta que se pulse";
        var box = document.createElement("input");
        box.type = "checkbox";
        box.name = "spoiler_nueva";
        box.value = i;
        // Cada casilla dice de qué imagen es, para que un lector de pantalla no oiga varias «Spoiler» iguales.
        box.setAttribute("aria-label", "La imagen " + (i + 1) + " (" + item.file.name + ") es un spoiler");
        box.checked = item.spoiler;
        box.addEventListener("change", function () { item.spoiler = box.checked; });
        spoiler.append(box, " Spoiler");
        var remove = document.createElement("button");
        remove.type = "button";
        remove.className = "composer-remove";
        remove.setAttribute("aria-label", "Quitar " + item.file.name);
        remove.textContent = "×";
        remove.addEventListener("click", function () {
          chosen.splice(i, 1);
          note.hidden = true;
          sync();
        });
        slot.append(img, spoiler, remove);
        previews.append(slot);
      });
    }

    input.addEventListener("change", function () {
      Promise.all(Array.prototype.slice.call(input.files).map(shrink)).then(function (picked) {
        chosen = chosen.concat(picked.map(function (file) { return { file: file, spoiler: false }; }));
        note.textContent = "Caben " + max + " imágenes por publicación: se han quedado fuera las últimas.";
        note.hidden = chosen.length <= max;
        chosen = chosen.slice(0, max);
        sync();
      });
    });
  })();
</script>
