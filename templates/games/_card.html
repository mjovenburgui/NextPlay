<a class="card" href="{{ game.get_absolute_url }}">
  <div class="cover">
    {% if game.cover_url %}
      <img src="{{ game.cover_url }}" alt="" loading="lazy">
    {% else %}
      <span class="cover-fallback">{{ game.name }}</span>
    {% endif %}
    {% if status %}<span class="badge">{{ status }}</span>{% endif %}
  </div>
  <p class="card-title">{{ game.name }}</p>
  {% if game.release_year %}<p class="muted small">{{ game.release_year }}</p>{% endif %}
</a>
