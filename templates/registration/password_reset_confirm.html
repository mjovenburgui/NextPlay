{% extends "base.html" %}

{% block title %}Nueva contraseña · NextPlay{% endblock %}

{% block content %}
  <section class="panel">
    <h1>Nueva contraseña</h1>
    {% if validlink %}
      <form method="post">
        {% include "_form.html" %}
        <button class="btn btn-primary" type="submit">Cambiar contraseña</button>
      </form>
    {% else %}
      <p>El enlace no es válido o ya se ha usado. <a href="{% url 'password_reset' %}">Pide uno nuevo</a>.</p>
    {% endif %}
  </section>
{% endblock %}
